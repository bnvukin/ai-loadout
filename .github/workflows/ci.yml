name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: python -m pip install --upgrade pip -e ".[dev]"
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .

  test:
    name: Test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with dev extras
        run: python -m pip install --upgrade pip -e ".[dev]"
      - name: Run tests
        run: pytest -q
      - name: Smoke-test the CLI
        run: |
          python -m ai_loadout version
          python -m ai_loadout scan
          python -m ai_loadout plan --profile minimal --no-models

  package:
    name: Package (wheel smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade pip build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Validate distributions
        run: twine check dist/*
      - name: Install wheel and smoke-test
        run: |
          WHEEL=$(ls dist/*.whl | head -1)
          pip install "${WHEEL}[dashboard]"
          loadout --help
          loadout version
          loadout self-test
          python -c "
          from ai_loadout.dashboard.assets import static_dir
          from ai_loadout.dashboard.server import create_app
          root = static_dir()
          assert (root / 'index.html').is_file()
          create_app()
          print('wheel smoke ok')
          "

  e2e:
    name: E2E (fresh wheel / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade pip build
      - name: Build wheel
        run: python -m build
      - name: Install wheel into clean venv and run self-test
        shell: bash
        run: |
          python -m venv .ci-e2e-venv
          if [ "${{ runner.os }}" = "Windows" ]; then
            source .ci-e2e-venv/Scripts/activate
          else
            source .ci-e2e-venv/bin/activate
          fi
          WHEEL=$(ls dist/*.whl | head -1)
          pip install "${WHEEL}[dashboard]"
          loadout --version
          loadout self-test --bind-http
          loadout scan
